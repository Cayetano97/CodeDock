name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · Vitest + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    name: Backend · cargo test (macOS only)
    # CodeDock is macOS-only by design (menu-bar app, LSUIElement,
    # ActivationPolicy::Accessory, dmg bundle), so unlike QuickSpot
    # there is no 3-OS matrix here: the backend is exercised where it ships.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # generate_context! embeds ../dist at compile time, so the frontend
      # must be built before the Rust side compiles.
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
