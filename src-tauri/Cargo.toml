[package]
name = "codedock"
version = "0.2.0"
description = "Launch your projects in your terminal with opencode"
authors = ["Cayetano97"]
edition = "2021"

[lib]
name = "codedock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
